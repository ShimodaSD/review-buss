services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reviews
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews -d reviews"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
  importer:
    build: .
    profiles: ["import"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://reviews:${POSTGRES_PASSWORD}@db:5432/reviews"
      GOOGLE_LOCATION: ${GOOGLE_LOCATION}
      GOOGLE_ACCESS_TOKEN: ${GOOGLE_ACCESS_TOKEN}
volumes:
  postgres_data:
